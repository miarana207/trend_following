name: Binance Trend Following Scanner

"on":
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ----------------------------------------------------------
      # EMA50/EMA200 : persistance du dernier croisement alerté.
      # Le workflow reste horaire pour ne pas modifier le fonctionnement
      # existant. Le cache sert uniquement à éviter une répétition de la
      # même alerte 4H sur plusieurs scans horaires.
      # ----------------------------------------------------------
      - name: Restore EMA50/EMA200 state
        uses: actions/cache/restore@v4
        with:
          path: |
            ema_cross_state.json
            ema_risk_state.json
          key: ema-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ema-state-${{ github.ref_name }}-
            ema-cross-state-${{ github.ref_name }}-

      - name: Verify files
        run: |
          test -f trend_following_binance.py
          echo "trend_following_binance.py : OK"

      - name: Run Binance Trend Following Scanner
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"

          BINANCE_BASE_URL: https://data-api.binance.vision
          BINANCE_SPOT_BASE_URL: https://data-api.binance.vision

          QUOTE_ASSETS: ""
          EXCLUDE_STABLECOINS: "true"
          EXCLUDE_LEVERAGED_TOKENS: "true"

          MAX_SPREAD_PERCENT: "0.10"
          MIN_24H_QUOTE_VOLUME: "1000000"
          MIN_HISTORY_DAYS: "30"

          ORDER_BOOK_DEPTH_ENABLED: "true"
          ORDER_BOOK_DEPTH_LIMIT: "100"
          ORDER_BOOK_DEPTH_PCT: "0.25"
          MIN_ORDER_BOOK_DEPTH_QUOTE: "25000"
          ORDER_BOOK_DEPTH_WORKERS: "8"

          TREND_INTERVAL: "1h"
          TREND_SIGNAL_DIRECTIONS: "BOTH"
          EMA_TREND_PERIOD: "200"

          SUPERTREND_ATR_PERIOD: "10"
          SUPERTREND_MULTIPLIER: "3.0"

          ADX_PERIOD: "14"
          ADX_THRESHOLD: "25"

          MACD_FAST_PERIOD: "12"
          MACD_SLOW_PERIOD: "26"
          MACD_SIGNAL_PERIOD: "9"

          BB_PERIOD: "20"
          BB_STDDEV_MULT: "2.0"
          BB_VOLUME_SMA_PERIOD: "20"
          BB_VOLUME_MULT: "1.5"

          ICHIMOKU_TENKAN_PERIOD: "9"
          ICHIMOKU_KIJUN_PERIOD: "26"
          ICHIMOKU_SENKOU_B_PERIOD: "52"
          ICHIMOKU_DISPLACEMENT: "26"

          TREND_KLINES_LIMIT: "500"
          TREND_WORKERS: "8"

          BONUS_WEIGHT_MACD: "40"
          BONUS_WEIGHT_BOLLINGER: "30"
          BONUS_WEIGHT_ICHIMOKU: "30"

          EMA_NEAR_05_PCT: "0.5"
          EMA_NEAR_1_PCT: "1.0"
          EMA_NEAR_2_PCT: "2.0"
          EMA_NEAR_5_PCT: "5.0"
          EMA_DIAGNOSTIC_TOP_N: "20"

          # --------------------------------------------------------
          # NOUVELLE SURVEILLANCE — EMA50/EMA200
          # Indépendante des autres indicateurs et sans filtrage.
          # --------------------------------------------------------
          EMA_CROSS_INTERVAL: "4h"
          EMA_CROSS_FAST_PERIOD: "50"
          EMA_CROSS_SLOW_PERIOD: "200"
          EMA_CROSS_KLINES_LIMIT: "500"
          EMA_CROSS_STATE_FILE: "ema_cross_state.json"

          # --------------------------------------------------------
          # GESTION DU RISQUE EMA50/EMA200 — SIMULATION UNIQUEMENT
          # SL / TP fixes à l'entrée + trailing dynamique.
          # Aucun ordre Binance n'est exécuté.
          # --------------------------------------------------------
          EMA_RISK_ENABLED: "true"
          EMA_RISK_SL_PERCENT: "3.0"
          EMA_RISK_TP_PERCENT: "6.0"
          EMA_RISK_TRAIL_PERCENT: "1.5"
          EMA_RISK_STATE_FILE: "ema_risk_state.json"

          HTTP_TIMEOUT_SECONDS: "20"
          HTTP_RETRIES: "3"

          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: "465"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TOP_RESULTS: "50"

        run: |
          python -u trend_following_binance.py

      - name: Save EMA50/EMA200 state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ema_cross_state.json
            ema_risk_state.json
          key: ema-state-${{ github.ref_name }}-${{ github.run_id }}
